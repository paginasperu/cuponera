<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuponera | OFICIAL.PE</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #F8F9FA;
      color: #111111;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    .brand {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #726C5D;
      margin-bottom: 24px;
    }

    h1 {
      font-size: clamp(28px, 5vw, 38px);
      font-weight: 500;
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: #111111;
      margin-bottom: 12px;
    }

    p.subtitle {
      font-size: 15px;
      color: #666666;
      margin-bottom: 32px;
      line-height: 1.4;
    }

    p.subtitle strong {
      color: #111111;
      font-weight: 600;
    }

    /* Formulario */
    form {
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: left;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    label {
      font-size: 13px;
      font-weight: 500;
      color: #333333;
    }

    label .req {
      color: #c81d2c;
    }

    label .opt {
      color: #888888;
      font-weight: 400;
      font-size: 12px;
    }

    input[type="text"],
    input[type="tel"],
    input[type="email"],
    select {
      width: 100%;
      height: 48px;
      padding: 0 16px;
      font-size: 15px;
      font-family: inherit;
      color: #111111;
      background: #FFFFFF;
      border: 1px solid #E0E0E0;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      appearance: none;
      -webkit-appearance: none;
    }

    input:focus, select:focus {
      border-color: #111111;
      box-shadow: 0 0 0 2px rgba(17, 17, 17, 0.08);
    }

    /* Prefijo +51 */
    .prefix-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .prefix-wrapper .prefix {
      position: absolute;
      left: 14px;
      font-size: 15px;
      color: #666666;
      pointer-events: none;
    }

    .prefix-wrapper input {
      padding-left: 48px;
    }

    /* Manejo de errores */
    .field.error input,
    .field.error select {
      border-color: #C81D2C;
      background-color: #FFF8F8;
    }

    .error-msg {
      display: none;
      font-size: 12px;
      color: #C81D2C;
    }

    .field.error .error-msg {
      display: block;
    }

    /* Botón Ovalado Minimalista */
    button.submit-btn {
      margin-top: 12px;
      width: 100%;
      height: 50px;
      background: transparent;
      color: #111111;
      border: 1px solid #D0D0D0;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button.submit-btn:hover {
      border-color: #111111;
      background: #111111;
      color: #FFFFFF;
    }

    button.submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      background: transparent;
      color: #111111;
      border-color: #D0D0D0;
    }

    /* Banners de respuesta */
    .banner {
      display: none;
      margin-top: 16px;
      padding: 14px;
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
      line-height: 1.4;
    }

    .banner.show { display: block; }
    .banner.success { background: #EBF7EE; color: #1E6B37; border: 1px solid #C2E7C9; }
    .banner.err { background: #FDE8E8; color: #9B1C1C; border: 1px solid #F8B4B4; }

    @media (max-width: 480px) {
      .row { grid-template-columns: 1fr; gap: 16px; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="brand">OFICIAL.PE</div>
  
  <h1>Suscripción a la cuponera</h1>
  <p class="subtitle">Recibe cupones y promociones exclusivas de marcas y negocios en tu distrito.</p>

  <form id="cuponeraForm" novalidate>
    
    <div class="field" data-field="nombres">
      <label for="nombres">Tu nombre<span class="req">*</span></label>
      <input type="text" id="nombres" name="nombres" placeholder="Ej: María" required>
      <span class="error-msg">Ingresa tu nombre.</span>
    </div>

    <div class="row">
      <div class="field" data-field="distrito">
        <label for="distrito">Distrito<span class="req">*</span></label>
        <select id="distrito" name="distrito" required>
          <option value="">Selecciona</option>
        </select>
        <span class="error-msg">Selecciona tu distrito.</span>
      </div>

      <div class="field" data-field="telefono">
        <label for="telefono">WhatsApp / Celular<span class="req">*</span></label>
        <div class="prefix-wrapper">
          <span class="prefix">+51</span>
          <input type="tel" id="telefono" name="telefono" placeholder="987 654 321" maxlength="11" inputmode="numeric" required>
        </div>
        <span class="error-msg">Celular de 9 dígitos.</span>
      </div>
    </div>

    <div class="row">
      <div class="field" data-field="categoria">
        <label for="categoria">¿Qué te interesa?<span class="req">*</span></label>
        <select id="categoria" name="categoria" required>
          <option value="">Selecciona interés</option>
          <option value="Comida / Restaurantes">Comida / Restaurantes</option>
          <option value="Belleza / Cuidado Personal">Belleza / Cuidado Personal</option>
          <option value="Ropa / Moda">Ropa / Moda</option>
          <option value="Entretenimiento / Eventos">Entretenimiento / Eventos</option>
          <option value="Servicios Técnicos">Servicios para el Hogar</option>
          <option value="Todas las categorías">Todas las categorías</option>
          <option value="Otro">Otro...</option>
        </select>
        <span class="error-msg">Selecciona un interés.</span>
      </div>

      <div class="field" id="categoriaOtraContainer" style="display: none;" data-field="categoriaOtra">
        <label for="categoriaOtra">Especifique interés<span class="req">*</span></label>
        <input type="text" id="categoriaOtra" name="categoriaOtra" placeholder="Ej: Mascotas / Veterinaria">
        <span class="error-msg">Escribe tu interés.</span>
      </div>
    </div>

    <div class="field" data-field="correo">
      <label for="correo">Correo electrónico <span class="opt">(opcional)</span></label>
      <input type="email" id="correo" name="correo" placeholder="tu@correo.com">
      <span class="error-msg">Ingresa un correo válido.</span>
    </div>

    <!-- Honeypot anti-spam -->
    <div style="position:absolute;left:-9999px;" aria-hidden="true">
      <input type="text" id="sitioWeb" name="sitioWeb" tabindex="-1" autocomplete="off">
    </div>

    <button type="submit" class="submit-btn" id="submitBtn">Unirme a la cuponera</button>

    <div class="banner" id="formBanner" role="alert" aria-live="polite"></div>
  </form>
</div>

<script>
(function(){
  "use strict";

  var form = document.getElementById("cuponeraForm");
  var banner = document.getElementById("formBanner");
  var submitBtn = document.getElementById("submitBtn");

  // Reemplaza por la URL ejecutable de tu Apps Script
  var SHEET_ENDPOINT = "REEMPLAZAR_CON_TU_NUEVO_URL_EXEC_APPS_SCRIPT";
  var DRAFT_KEY = "of_cuponera_subscriber_draft";
  var isSubmitting = false;

  // --- DISTRITOS (LIMA Y CALLAO) ---
  var distritos = [
    "Ancón","Ate","Barranco","Bellavista","Breña","Callao","Carabayllo","Carmen de La Legua-Reynoso",
    "Chaclacayo","Chorrillos","Cieneguilla","Comas","El Agustino","Independencia","Jesús María",
    "La Molina","La Perla","La Punta","La Victoria","Lima","Lince","Los Olivos","Lurigancho","Lurín",
    "Magdalena del Mar","Mi Perú","Miraflores","Pachacámac","Pucusana","Pueblo Libre","Puente Piedra",
    "Punta Hermosa","Punta Negra","Rímac","San Bartolo","San Borja","San Isidro","San Juan de Lurigancho",
    "San Juan de Miraflores","San Luis","San Martín de Porres","San Miguel","Santa Anita",
    "Santa María del Mar","Santa Rosa","Santiago de Surco","Surquillo","Ventanilla","Villa El Salvador","Villa María del Triunfo"
  ];
  
  var selDistrito = document.getElementById("distrito");
  var distMap = {};
  distritos.forEach(function(d){
    var opt = document.createElement("option");
    opt.value = d;
    opt.textContent = d;
    selDistrito.appendChild(opt);
    distMap[d.toLowerCase()] = d;
  });

  // --- CONTROL DE "OTRO" ---
  var selCategoria = document.getElementById("categoria");
  var containerOtra = document.getElementById("categoriaOtraContainer");
  var inputOtra = document.getElementById("categoriaOtra");

  function handleCategoriaChange() {
    if (selCategoria.value === "Otro") {
      containerOtra.style.display = "flex";
    } else {
      containerOtra.style.display = "none";
      inputOtra.value = "";
      setError("categoriaOtra", false);
    }
  }
  selCategoria.addEventListener("change", handleCategoriaChange);

  // --- MÁSCARA DE TELÉFONO ---
  var telInput = document.getElementById("telefono");
  telInput.addEventListener("input", function(){
    var clean = this.value.replace(/\D/g, "").slice(0, 9);
    if (clean.length > 6) this.value = clean.slice(0,3) + " " + clean.slice(3,6) + " " + clean.slice(6);
    else if (clean.length > 3) this.value = clean.slice(0,3) + " " + clean.slice(3);
    else this.value = clean;
    saveDraft();
  });

  // --- LOCALSTORAGE (AUTOGUARDADO) ---
  function saveDraft() {
    if (isSubmitting) return;
    var draft = {
      nombres: form.nombres.value,
      distrito: selDistrito.value,
      telefono: telInput.value,
      categoria: selCategoria.value,
      categoriaOtra: inputOtra.value,
      correo: form.correo.value
    };
    try { localStorage.setItem(DRAFT_KEY, JSON.stringify(draft)); } catch(e){}
  }

  function loadDraft() {
    try {
      var raw = localStorage.getItem(DRAFT_KEY);
      if (!raw) return;
      var draft = JSON.parse(raw);
      if (draft.nombres) form.nombres.value = draft.nombres;
      if (draft.distrito) selDistrito.value = draft.distrito;
      if (draft.telefono) telInput.value = draft.telefono;
      if (draft.categoria) selCategoria.value = draft.categoria;
      handleCategoriaChange();
      if (draft.categoriaOtra) inputOtra.value = draft.categoriaOtra;
      if (draft.correo) form.correo.value = draft.correo;
    } catch(e){}
  }

  form.addEventListener("input", saveDraft);
  form.addEventListener("change", saveDraft);
  loadDraft();

  // --- VALIDACIÓN ---
  function setError(name, hasError) {
    var f = form.querySelector('[data-field="' + name + '"]');
    if (f) f.classList.toggle("error", hasError);
  }

  function validate() {
    var nombresOk = form.nombres.value.trim().length >= 2;
    setError("nombres", !nombresOk);

    var distVal = selDistrito.value.trim();
    var distOk = !!distMap[distVal.toLowerCase()];
    setError("distrito", !distOk);

    var phoneDigits = form.telefono.value.replace(/\D/g, "");
    var phoneOk = phoneDigits.length === 9 && phoneDigits.startsWith("9");
    setError("telefono", !phoneOk);

    var catVal = selCategoria.value;
    var catOk = catVal !== "";
    setError("categoria", !catOk);

    var catOtraOk = true;
    if (catVal === "Otro") {
      catOtraOk = inputOtra.value.trim().length >= 2;
      setError("categoriaOtra", !catOtraOk);
    } else {
      setError("categoriaOtra", false);
    }

    var correoVal = form.correo.value.trim();
    var correoOk = true;
    if (correoVal.length > 0) {
      correoOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correoVal);
    }
    setError("correo", !correoOk);

    return nombresOk && distOk && phoneOk && catOk && catOtraOk && correoOk;
  }

  // --- ENVÍO ---
  form.addEventListener("submit", function(e){
    e.preventDefault();
    
    if (!validate()) {
      banner.textContent = "Revisa los campos requeridos.";
      banner.className = "banner show err";
      return;
    }

    // Honeypot
    if (document.getElementById("sitioWeb").value.trim() !== "") {
      banner.textContent = "¡Te has suscrito con éxito!";
      banner.className = "banner show success";
      localStorage.removeItem(DRAFT_KEY);
      form.reset();
      return;
    }

    var finalCategoria = selCategoria.value === "Otro" ? inputOtra.value.trim() : selCategoria.value;

    var payload = {
      nombres: form.nombres.value.trim(),
      distrito: selDistrito.value.trim(),
      telefono: form.telefono.value.replace(/\D/g, ""),
      categoria: finalCategoria,
      correo: form.correo.value.trim()
    };

    isSubmitting = true;
    submitBtn.disabled = true;
    submitBtn.textContent = "Procesando...";

    fetch(SHEET_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    })
    .then(function(res){
      if (!res.ok) throw new Error("Error en servidor");
      return res.json();
    })
    .then(function(data){
      if (data && data.result === "success") {
        banner.textContent = "¡Listo! Te has suscrito correctamente a la cuponera.";
        banner.className = "banner show success";
        localStorage.removeItem(DRAFT_KEY);
        form.reset();
        handleCategoriaChange();
      } else {
        banner.textContent = (data && data.message) || "No se pudo completar el registro.";
        banner.className = "banner show err";
      }
    })
    .catch(function(){
      banner.textContent = "Error de conexión. Inténtalo de nuevo.";
      banner.className = "banner show err";
    })
    .finally(function(){
      isSubmitting = false;
      submitBtn.disabled = false;
      submitBtn.textContent = "Unirme a la cuponera";
    });
  });
})();
</script>
</body>
</html>
